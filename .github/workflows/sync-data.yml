name: Sync data.json

on:
  schedule:
    - cron: "0 12 1 * *" # el día 1 de cada mes, 12:00 UTC (~09:00 ART)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sumar a bgg_data.jsonl los juegos de universo_juegos.jsonl que todavía no tienen datos de BGG
        run: python3 01_data_understanding/collect_initial_data/search_new_game.py

      - name: Integrar fuentes (mis_datos.jsonl + universo_juegos.jsonl + bgg_data.jsonl + grupos.json + cazagangas_data.jsonl)
        run: python3 02_data_preparation/integrate_data.py

      - name: Construir columnas derivadas
        run: python3 02_data_preparation/construct_data.py

      - name: Recortar Watchlist (pocas reviews + top N por rating)
        run: python3 02_data_preparation/select_data.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/data.json data/01_data_understanding/bgg_data.jsonl
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Sync data.json [skip ci]"
            git push
          fi
