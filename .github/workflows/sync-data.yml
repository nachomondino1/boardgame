name: Sync data.json

on:
  schedule:
    - cron: "0 12 1 * *" # el día 1 de cada mes, 12:00 UTC (~09:00 ART)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refrescar top N de BGG
        run: python3 01_data_understanding/bgg/collect_bgg_rankings.py

      - name: Enriquecer con BGG (placeholder hasta aprobación de la API)
        run: python3 01_data_understanding/bgg/enrich_bgg.py

      - name: Integrar fuentes
        run: python3 02_data_preparation/integrate_data.py

      - name: Construir columnas derivadas
        run: python3 02_data_preparation/construct_data.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/data.json 01_data_understanding/bgg/bgg_top1000.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Sync data.json [skip ci]"
            git push
          fi
