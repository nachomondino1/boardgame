name: Sync data.json desde Google Sheet

on:
  schedule:
    - cron: "0 12 * * *" # todos los días 12:00 UTC (~09:00 ART)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerar data.json
        run: python3 scripts/build_data.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "Sync data.json desde Google Sheet [skip ci]"
            git push
          fi
