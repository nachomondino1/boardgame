<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Cuál comprar? — Juegos de mesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div id="nav"></div>
      <h1>🛒 ¿Cuál comprar?</h1>
      <p class="subtitle">Watchlist, filtrados por tipo, duración, complejidad y jugadores</p>
      <div class="filters-panel">
        <div class="filter-grid">
          <div class="filter-group filter-group--full">
            <span class="filter-label">Tipo</span>
            <div class="chip-row" id="tipo-chips"></div>
          </div>
          <div class="filter-group filter-group--grow">
            <label class="filter-label" for="duracion-max">Duración máxima <span class="filter-label-value" id="duracion-max-label">180+ min</span></label>
            <input type="range" id="duracion-max" min="10" max="180" step="5" value="180" />
          </div>
          <div class="filter-group filter-group--grow">
            <label class="filter-label" for="complejidad-max">Complejidad máxima <span class="filter-label-value" id="complejidad-max-label">5 (sin límite)</span></label>
            <input type="range" id="complejidad-max" min="1" max="5" step="0.1" value="5" />
          </div>
          <div class="filter-group">
            <span class="filter-label">Jugadores</span>
            <div class="player-stepper">
              <button id="player-minus">−</button>
              <span id="player-label">todos</span>
              <button id="player-plus">+</button>
              <button id="player-clear" title="Quitar filtro">✕</button>
            </div>
          </div>
          <div class="filter-group filter-group--grow">
            <label class="filter-label" for="sort-select">Orden</label>
            <select id="sort-select">
              <option value="p_x_r_desc">Puntaje ajustado (P×r)</option>
              <option value="puntaje_bgg_desc">Puntaje BGG</option>
              <option value="complejidad_asc">Complejidad (menor primero)</option>
              <option value="duracion_asc">Duración (menor primero)</option>
              <option value="nombre_asc">Nombre</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="result-count" id="result-count"></div>
  <main>
    <div class="grid" id="grid"></div>
  </main>
  <script src="js/shared.js"></script>
  <script src="js/comprar.js"></script>
</body>
</html>
