<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Qué jugamos hoy? — Juegos de mesa</title>
  <meta name="description" content="Elegí cuántos jugadores son y descubrí qué juegos de mesa podés jugar hoy con lo que ya tenés." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" /></noscript>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hoy.css" />
  <link rel="preload" href="data/data.json" as="fetch" crossorigin="anonymous" />

  <script src="js/shared.js" defer></script>
  <script src="js/hoy.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <header>
    <div class="header-inner">
      <h1>🎲 ¿Qué jugamos hoy?</h1>
      <p class="subtitle">Decime cuántos son y te digo qué podés jugar (de lo que ya tenés)</p>
      <div class="big-stepper">
        <button id="player-minus">−</button>
        <span class="big-number" id="player-number">?</span>
        <button id="player-plus">+</button>
      </div>
      <div class="filters-panel open">
        <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="true" aria-controls="filter-grid">Filtros</button>
        <div class="filter-grid filter-grid--center" id="filter-grid">
          <div class="filter-group">
            <label class="toggle-gusto">
              <input type="checkbox" id="incluir-deseados" />
              Incluir los juegos que aún no tengo (Watchlist)
            </label>
          </div>
          <div class="filter-group">
            <label class="toggle-gusto">
              <input type="checkbox" id="solo-best" />
              Solo juegos donde esta cantidad es la ideal
            </label>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="result-count" id="result-count"></div>
  <main>
    <div id="grid"></div>
  </main>
</body>
</html>
