<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi colección</title>
  <meta name="description" content="Marcá qué juegos de mesa tenés, tuviste o querés comprar. Se guarda en este navegador." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" /></noscript>

  <link rel="stylesheet" href="css/components/base.css" />
  <link rel="stylesheet" href="css/components/nav.css" />
  <link rel="stylesheet" href="css/components/header.css" />
  <link rel="stylesheet" href="css/pages/coleccion.css" />
  <link rel="preload" href="data/names.json" as="fetch" crossorigin="anonymous" />

  <script src="js/shared.js" defer></script>
  <script src="js/coleccion.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="header-titles">
          <h1>✏️ Mi colección</h1>
          <p class="subtitle">Buscá un juego y marcá si lo tenés, lo tuviste o lo querés comprar</p>
        </div>
        <div class="header-search">
          <div class="search-box">
            <input type="text" id="search" placeholder="Buscar juego (ej: catan)" autocomplete="off" />
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="coleccion">
    <p class="coleccion__note">Se guarda solo en este navegador. Después vas a poder traerla con tu usuario de BGG.</p>
    <section aria-label="Resultados de la búsqueda">
      <ul class="col-list" id="results"></ul>
    </section>
    <section aria-label="Tu colección">
      <div class="col-heading">
        <h2 id="mine-title">Tu colección</h2>
        <button type="button" class="col-clear" id="clear-all" hidden>Borrar mis datos</button>
      </div>
      <ul class="col-list" id="mine"></ul>
    </section>
  </main>
  <footer class="site-footer">
    <a href="https://boardgamegeek.com" target="_blank" rel="noopener"><img src="img/powered-by-bgg.webp" alt="Powered by BGG" height="40"></a>
  </footer>
</body>
</html>
