<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Cuál comprar? — Juegos de mesa</title>
  <meta name="description" content="Watchlist y lista de deseados de juegos de mesa, filtrados por duración, complejidad y cantidad de jugadores." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" /></noscript>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" href="data/data.json" as="fetch" crossorigin="anonymous" />

  <script src="js/shared.js" defer></script>
  <script src="js/comprar.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="header-titles">
          <h1>🛒 ¿Cuál comprar?</h1>
          <p class="subtitle">Watchlist, filtrados por tipo, duración, complejidad y jugadores</p>
        </div>
        <div class="header-search">
          <div class="search-box">
            <input type="text" id="search" placeholder="Buscar juego (ej: pandemic)" />
          </div>
        </div>
      </div>
      <div class="filters-panel open">
        <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="true" aria-controls="filter-grid">Filtros</button>
        <div class="filter-grid filter-grid--nowrap" id="filter-grid">
          <div class="filter-group">
            <span class="filter-label">Jugadores</span>
            <div class="player-stepper">
              <button id="player-minus">−</button>
              <span id="player-label">todos</span>
              <button id="player-plus">+</button>
              <button id="player-clear" title="Quitar filtro">✕</button>
            </div>
            <label class="toggle-gusto" id="best-toggle-label" for="best-only">
              <input type="checkbox" id="best-only" disabled />
              Solo si es el mejor número
            </label>
          </div>
          <div class="filter-group filter-group--grow">
            <label class="filter-label" for="duracion-max">Duración máxima <span class="filter-label-value" id="duracion-max-label">180+ min</span></label>
            <input type="range" id="duracion-max" min="10" max="180" step="5" value="180" />
          </div>
          <div class="filter-group filter-group--grow">
            <label class="filter-label" for="complejidad-max">Complejidad máxima <span class="filter-label-value" id="complejidad-max-label">5 (sin límite)</span></label>
            <input type="range" id="complejidad-max" min="1" max="5" step="0.1" value="5" />
          </div>
          <div class="filter-group filter-group--capped">
            <label class="filter-label" id="tipo-label">Tipo</label>
            <div class="multiselect" id="tipo-multiselect">
              <button type="button" class="multiselect-button" id="tipo-button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="tipo-label">
                <span id="tipo-button-label">Todos</span>
              </button>
              <div class="multiselect-panel" id="tipo-panel" role="listbox" aria-multiselectable="true" hidden></div>
            </div>
          </div>
          <div class="filter-group filter-group--checkbox">
            <label class="toggle-gusto" for="quiero-comprar-only">
              <input type="checkbox" id="quiero-comprar-only" />
              Solo "Want to buy"
            </label>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="result-count-row">
    <span id="result-count"></span>
    <label class="sort-control" for="sort-select">
      <span class="sort-icon" aria-hidden="true">⇅</span>
      <select id="sort-select">
        <option value="puntaje_ajust_bgg_desc">Puntaje ajustado</option>
        <option value="puntaje_bgg_desc">Puntaje BGG</option>
        <option value="precio_calidad_desc">Precio / calidad</option>
        <option value="costo_asc">Costo (menor primero)</option>
        <option value="complejidad_asc">Complejidad (menor primero)</option>
        <option value="duracion_asc">Duración (menor primero)</option>
        <option value="nombre_asc">Nombre</option>
      </select>
    </label>
  </div>
  <main>
    <div class="grid" id="grid"></div>
  </main>
</body>
</html>
