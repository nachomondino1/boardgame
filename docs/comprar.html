<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Cuál comprar? — Juegos de mesa</title>
  <meta name="description" content="Watchlist y lista de deseados de juegos de mesa, filtrados por duración, complejidad y cantidad de jugadores, con comparador lado a lado." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" /></noscript>

  <link rel="stylesheet" href="css/components/base.css" />
  <link rel="stylesheet" href="css/components/nav.css" />
  <link rel="stylesheet" href="css/components/header.css" />
  <link rel="stylesheet" href="css/components/filters.css" />
  <link rel="stylesheet" href="css/components/results-bar.css" />
  <link rel="stylesheet" href="css/components/cards.css" />
  <link rel="stylesheet" href="css/components/filter-pills.css" />
  <link rel="stylesheet" href="css/pages/comprar.css" />
  <link rel="stylesheet" href="css/pages/comparar.css" />
  <link rel="preload" href="data/index.json" as="fetch" crossorigin="anonymous" />

  <script src="js/shared.js" defer></script>
  <script src="js/filter-pills.js" defer></script>
  <script src="js/comprar.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="header-titles">
          <h1>🛒 ¿Cuál comprar?</h1>
          <a class="price-link" href="https://www.cazagangas.com.ar" target="_blank" rel="noopener">💰 Ver precios en Argentina (Cazagangas) ↗</a>
        </div>
        <div class="header-search">
          <div class="search-box">
            <input type="text" id="search" placeholder="Buscar juego (ej: pandemic)" />
          </div>
        </div>
      </div>
      <div class="filter-bar">
        <div class="filter-pills" id="filter-pills"></div>
      </div>
    </div>
  </header>
  <div class="result-count-row">
    <div class="result-left">
      <span id="result-count"></span>
      <button type="button" class="clear-filters" id="clear-filters" hidden></button>
    </div>
    <label class="sort-control" for="sort-select">
      <span class="sort-icon" aria-hidden="true">⇅</span>
      <select id="sort-select">
        <option value="ranking_bgg_asc">Ranking BGG</option>
        <option value="puntaje_bgg_desc">Puntaje BGG</option>
        <option value="precio_calidad_desc">Precio / calidad</option>
        <option value="costo_asc">Costo (menor primero)</option>
        <option value="complejidad_asc">Complejidad (menor primero)</option>
        <option value="duracion_asc">Duración (menor primero)</option>
        <option value="nombre_asc">Nombre</option>
      </select>
    </label>
  </div>
  <main>
    <div class="compare-panel" id="compare-panel">
      <button type="button" class="compare-toggle" id="compare-toggle" aria-expanded="false" aria-controls="compare-body">⚔️ Comparar dos juegos</button>
      <div class="compare-body" id="compare-body" hidden>
        <div class="compare-pickers">
          <div class="compare-picker">
            <label class="filter-label" for="game-a">Juego A</label>
            <input type="text" id="game-a" list="games-list" placeholder="Ej: Cascadia" autocomplete="off" />
          </div>
          <span class="compare-vs">vs</span>
          <div class="compare-picker">
            <label class="filter-label" for="game-b">Juego B</label>
            <input type="text" id="game-b" list="games-list" placeholder="Ej: Harmonies" autocomplete="off" />
          </div>
        </div>
        <datalist id="games-list"></datalist>
        <div id="compare-result"></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="load-more-row" id="load-more-row"></div>
  </main>
  <footer class="site-footer">
    <a href="https://boardgamegeek.com" target="_blank" rel="noopener"><img src="img/powered-by-bgg.webp" alt="Powered by BGG" height="40"></a>
  </footer>
</body>
</html>
