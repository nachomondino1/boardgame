<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comparar — Juegos de mesa</title>
  <meta name="description" content="Comparar dos juegos de mesa lado a lado: jugadores, duración, complejidad, puntajes y más." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" /></noscript>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/comparar.css" />
  <link rel="preload" href="data/data.json" as="fetch" crossorigin="anonymous" />

  <script src="js/shared.js" defer></script>
  <script src="js/comparar.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <header>
    <div class="header-inner">
      <h1>⚔️ Comparar</h1>
      <p class="subtitle">Dos juegos, lado a lado</p>
      <div class="compare-pickers">
        <div class="compare-picker">
          <label class="filter-label" for="game-a">Juego A</label>
          <input type="text" id="game-a" list="games-list" placeholder="Ej: Cascadia" autocomplete="off" />
        </div>
        <span class="compare-vs">vs</span>
        <div class="compare-picker">
          <label class="filter-label" for="game-b">Juego B</label>
          <input type="text" id="game-b" list="games-list" placeholder="Ej: Harmonies" autocomplete="off" />
        </div>
      </div>
      <datalist id="games-list"></datalist>
    </div>
  </header>
  <main>
    <div id="compare-result"></div>
  </main>
</body>
</html>
