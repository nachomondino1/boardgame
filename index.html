<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juegos de mesa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎲 Juegos de mesa</h1>
    <p class="subtitle">Prototipo — snapshot de tu Sheet, buscador y filtro por cantidad de jugadores</p>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="search" placeholder="Buscar juego (ej: pandemic)" />
      </div>
      <div class="player-stepper">
        <button id="player-minus">−</button>
        <span id="player-label">todos</span>
        <button id="player-plus">+</button>
        <button id="player-clear" title="Quitar filtro">✕</button>
      </div>
      <select id="ocasion-select">
        <option value="Todas">Toda ocasión</option>
      </select>
      <select id="sort-select">
        <option value="p_x_r_desc">Orden: Puntaje ajustado (P×r)</option>
        <option value="puntaje_bgg_desc">Orden: Puntaje BGG</option>
        <option value="mi_puntaje_desc">Orden: Mi puntaje</option>
        <option value="complejidad_asc">Orden: Complejidad (menor primero)</option>
        <option value="duracion_asc">Orden: Duración (menor primero)</option>
        <option value="nombre_asc">Orden: Nombre</option>
      </select>
      <label class="toggle-gusto">
        <input type="checkbox" id="gusto-toggle" />
        Según mi gusto (≤60 min, complejidad ≤2.5)
      </label>
    </div>
    <div class="controls" style="margin-top: 8px;">
      <div class="chip-row" id="estado-chips"></div>
    </div>
  </header>
  <div class="result-count" id="result-count"></div>
  <main>
    <div class="grid" id="grid"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
